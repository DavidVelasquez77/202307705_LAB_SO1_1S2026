services:
  go-writer:
    build:
      context: ..
      dockerfile: apps/go-writer/Dockerfile
    container_name: go-writer
    environment:
      GRPC_PORT: "50051"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    ports:
      - "50051:50051"
    depends_on:
      rabbitmq:
        condition: service_healthy

  go-ingest:
    build:
      context: ..
      dockerfile: apps/go-ingest/Dockerfile
    container_name: go-ingest
    environment:
      GO_INGEST_PORT: "8081"
      GRPC_WRITER_ADDR: "go-writer:50051"
    ports:
      - "8081:8081"
    depends_on:
      - go-writer

  go-consumer:
    build:
      context: ..
      dockerfile: apps/go-consumer/Dockerfile
    container_name: go-consumer
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      VALKEY_URL: "redis://valkey:6379/0"
      ASSIGNED_COUNTRY: "CHN"
    depends_on:
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy

  go-stats-api:
    build:
      context: ..
      dockerfile: apps/go-stats-api/Dockerfile
    container_name: go-stats-api
    environment:
      VALKEY_URL: "redis://valkey:6379/0"
      STATS_API_PORT: "8082"
      ASSIGNED_COUNTRY: "CHN"
    ports:
      - "8082:8082"
    depends_on:
      valkey:
        condition: service_healthy

  rust-api:
    build:
      context: ..
      dockerfile: apps/rust-api/Dockerfile
    container_name: rust-api
    environment:
      RUST_API_PORT: "8080"
      GO_INGEST_URL: "http://go-ingest:8081/internal/report"
    ports:
      - "8080:8080"
    depends_on:
      - go-ingest

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2
    container_name: valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  valkey_data: