apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-writer
  namespace: proyecto3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-writer
  template:
    metadata:
      labels:
        app: go-writer
    spec:
      containers:
        - name: go-writer
          image: 136.113.143.168:5000/proyecto3/go-writer:dev
          imagePullPolicy: Always
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq.proyecto3.svc.cluster.local:5672/"
          ports:
            - name: grpc
              containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: go-writer
  namespace: proyecto3
spec:
  selector:
    app: go-writer
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
  type: ClusterIP
