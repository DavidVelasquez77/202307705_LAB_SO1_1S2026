apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-dapr-subscriber
  namespace: proyecto3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-dapr-subscriber
  template:
    metadata:
      labels:
        app: go-dapr-subscriber
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "go-dapr-subscriber"
        dapr.io/app-port: "8083"
    spec:
      imagePullSecrets:
        - name: zot-login
      containers:
        - name: go-dapr-subscriber
          image: 136.113.143.168:5000/proyecto3/go-dapr-subscriber:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          #  Optimización de Rendimiento 
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: go-dapr-subscriber
  namespace: proyecto3
spec:
  selector:
    app: go-dapr-subscriber
  ports:
    - port: 8083
      targetPort: 8083
